name: imdone
description: "I'm Done — say a task, get nagged until it is done, share it and confirm."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  cloud_firestore: ^6.9.0
  crypto: ^3.0.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0
  speech_to_text: ^7.4.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  http: ^1.6.0
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
